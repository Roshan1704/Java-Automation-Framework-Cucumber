# Browser Configuration
browser=chrome
headless=false
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Execution Mode (local, browserstack, saucelabs)
execution.mode=local

# Application URLs
base.url=https://example.com
api.base.url=https://api.example.com
app.name=Test Application
environment=QA

# Test Data
test.data.path=src/test/resources/testdata/

# Screenshots
screenshot.on.failure=true
screenshot.path=test-output/screenshots/

# Reporting
extent.report.path=test-output/reports/ExtentReport.html

# Logging
log.level=INFO

# Retry Configuration
retry.count=2

# Parallel Execution
parallel.execution=true
thread.count=3

# Database Configuration (Optional)
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=password

# Email Configuration (Optional)
email.to=test@example.com
email.from=automation@example.com
email.host=smtp.gmail.com
email.port=587
email.username=your-email@gmail.com
email.password=your-password

# BrowserStack Configuration (Optional)
browserstack.username=your-username
browserstack.accesskey=your-accesskey
browserstack.os=Windows
browserstack.os_version=10
browserstack.browser_version=latest

# Sauce Labs Configuration (Optional)
saucelabs.username=your-username
saucelabs.accesskey=your-accesskey
saucelabs.platform=Windows 10
saucelabs.browser_version=latest
